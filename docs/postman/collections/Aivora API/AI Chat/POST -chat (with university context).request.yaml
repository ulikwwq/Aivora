$kind: http-request
name: POST /chat (with university context)
description: Send a message with university context. Used when navigating from
  UniversityDetail page — the AI knows which university is being discussed from
  the very first message.
url: "{{baseUrl}}/chat"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "message": "What are the admission requirements?",
      "uniContext": "TU Munich"
    }
order: 2000

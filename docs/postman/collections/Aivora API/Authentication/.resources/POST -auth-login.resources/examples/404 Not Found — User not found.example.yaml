$kind: http-example
request:
  url: "{{baseUrl}}/auth/login"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "email": "aibek@example.com",
        "password": "securepassword"
      }
response:
  statusCode: 404
  statusText: Not Found
  body:
    type: text
    content: |-
      {
        "error": "User not found"
      }
order: 3000

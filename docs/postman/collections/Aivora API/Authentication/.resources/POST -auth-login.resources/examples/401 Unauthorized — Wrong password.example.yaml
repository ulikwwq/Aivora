$kind: http-example
request:
  url: "{{baseUrl}}/auth/login"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "email": "aibek@example.com",
        "password": "securepassword"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: text
    content: |-
      {
        "error": "Invalid credentials"
      }
order: 2000
